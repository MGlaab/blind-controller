<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-C3 Schedule Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #3b82f6;
      --success: #22c55e;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
    }

    h2 { margin: 0 0 4px 0; font-size: 1.4rem; text-align: center; }
    p.subtitle { text-align: center; color: var(--subtext); margin: 0 0 20px 0; font-size: 0.85rem; }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.2);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      margin-right: 6px;
    }
    .indicator.connected { background: var(--success); }

    .display-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .time-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .time-box label { display: block; font-size: 0.75rem; color: var(--subtext); text-transform: uppercase; margin-bottom: 4px; }
    .time-box .val { font-size: 1.15rem; font-weight: 700; color: var(--accent); }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--subtext);
    }

    input[type="time"] {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-connect { background: var(--accent); color: white; }
    .btn-save { background: var(--success); color: white; margin-top: 10px; }

    /* Toast Notification */
    .toast {
      display: none;
      background: #14532d;
      border: 1px solid var(--success);
      color: #dcfce7;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 0.85rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Schedule Control</h2>
    <p class="subtitle">ESP32-C3 Memory Controller</p>

    <div class="status-bar">
      <div>
        <span id="dot" class="indicator"></span>
        <span id="status-text">Disconnected</span>
      </div>
      <button id="connect-btn" class="btn btn-connect" style="width: auto; padding: 6px 12px;" onclick="toggleConnect()">Connect</button>
    </div>

    <!-- Live Stored Memory Readings -->
    <div class="display-panel">
      <div class="time-box">
        <label>Stored Open</label>
        <div id="disp-open" class="val">--:-- --</div>
      </div>
      <div class="time-box">
        <label>Stored Close</label>
        <div id="disp-close" class="val">--:-- --</div>
      </div>
    </div>

    <!-- Update Form -->
    <div class="form-group">
      <label for="input-open">New Open Time (12-Hour)</label>
      <input type="time" id="input-open" disabled>
    </div>

    <div class="form-group">
      <label for="input-close">New Close Time (12-Hour)</label>
      <input type="time" id="input-close" disabled>
    </div>

    <button id="save-btn" class="btn btn-save" onclick="saveTimes()" disabled>Save New Schedule</button>

    <!-- Confirmation Toast -->
    <div id="toast" class="toast"></div>
  </div>

  <script>
    const SERVICE_UUID        = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_STATUS_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    const CHAR_SET_OPEN_UUID  = "c3a110a1-7e88-412f-93d4-b333c1f19811";
    const CHAR_SET_CLOSE_UUID = "d4b221b2-8f99-4230-a4e5-c444d2f20922";

    let bleDevice = null;
    let charStatus = null, charOpen = null, charClose = null;
    let currentOpenStr = "", currentCloseStr = "";

    // Convert 24-hour input time "13:30" to 12-hour "01:30 PM"
    function format12Hour(time24) {
      if(!time24) return "";
      let [h, m] = time24.split(":");
      h = parseInt(h);
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      return `${String(h).padStart(2, '0')}:${m} ${ampm}`;
    }

    // Convert 12-hour "01:30 PM" to 24-hour "13:30" for <input type="time"> controls
    function parse12To24(time12) {
      if(!time12 || time12 === "--:-- --") return "";
      const match = time12.match(/^(\d{1,2}):(\d{2})\s(AM|PM)$/i);
      if(!match) return "";
      let h = parseInt(match[1]);
      const m = match[2];
      const ampm = match[3].toUpperCase();
      if (ampm === "PM" && h < 12) h += 12;
      if (ampm === "AM" && h === 12) h = 0;
      return `${String(h).padStart(2, '0')}:${m}`;
    }

    async function toggleConnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      } else {
        await connectBLE();
      }
    }

    async function connectBLE() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "ESP32C3_Time_Control" }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        charStatus = await service.getCharacteristic(CHAR_STATUS_UUID);
        charOpen   = await service.getCharacteristic(CHAR_SET_OPEN_UUID);
        charClose  = await service.getCharacteristic(CHAR_SET_CLOSE_UUID);

        // 1. Attach listener BEFORE starting notifications
        charStatus.addEventListener('characteristicvaluechanged', handleStatusUpdate);
        await charStatus.startNotifications();

        // 2. Explicitly read stored memory directly from ESP32
        const value = await charStatus.readValue();
        parseAndDisplayStatus(value);

        updateUI(true);
      } catch (error) {
        console.error("BLE Connect Error:", error);
      }
    }

    function handleStatusUpdate(event) {
      parseAndDisplayStatus(event.target.value);
    }

    // Decode raw BLE bytes to UI
    function parseAndDisplayStatus(dataView) {
      const decoder = new TextDecoder('utf-8');
      const jsonStr = decoder.decode(dataView);
      console.log("Received from ESP32 Flash:", jsonStr);

      try {
        const data = JSON.parse(jsonStr);
        currentOpenStr = data.open;
        currentCloseStr = data.close;

        // Update screen displays
        document.getElementById("disp-open").innerText = currentOpenStr;
        document.getElementById("disp-close").innerText = currentCloseStr;

        // Populate time input selectors
        document.getElementById("input-open").value = parse12To24(currentOpenStr);
        document.getElementById("input-close").value = parse12To24(currentCloseStr);
      } catch(e) {
        console.error("Error parsing JSON payload:", e);
      }
    }

    async function saveTimes() {
      const rawOpen = document.getElementById("input-open").value;
      const rawClose = document.getElementById("input-close").value;

      if (!rawOpen || !rawClose) {
        alert("Please select both open and close times.");
        return;
      }

      const newOpenStr = format12Hour(rawOpen);
      const newCloseStr = format12Hour(rawClose);

      const oldOpen = currentOpenStr;
      const oldClose = currentCloseStr;

      const encoder = new TextEncoder();

      // Write Open Time
      if (newOpenStr !== oldOpen) {
        await charOpen.writeValue(encoder.encode(newOpenStr));
      }

      // Write Close Time
      if (newCloseStr !== oldClose) {
        await charClose.writeValue(encoder.encode(newCloseStr));
      }

      // Display Confirmation Notification
      showToast(`
        <strong>✓ Memory Updated Successfully!</strong><br>
        Open: <s>${oldOpen}</s> ➔ <b>${newOpenStr}</b><br>
        Close: <s>${oldClose}</s> ➔ <b>${newCloseStr}</b>
      `);
    }

    function showToast(htmlMsg) {
      const toast = document.getElementById("toast");
      toast.innerHTML = htmlMsg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 6000);
    }

    function onDisconnected() {
      updateUI(false);
    }

    function updateUI(isConnected) {
      document.getElementById("dot").className = isConnected ? "indicator connected" : "indicator";
      document.getElementById("status-text").innerText = isConnected ? "Connected" : "Disconnected";
      document.getElementById("connect-btn").innerText = isConnected ? "Disconnect" : "Connect";
      
      document.getElementById("input-open").disabled = !isConnected;
      document.getElementById("input-close").disabled = !isConnected;
      document.getElementById("save-btn").disabled = !isConnected;
    }
  </script>
</body>
</html>
