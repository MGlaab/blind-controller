<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-C3 BLE Control</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .status {
      font-size: 0.9rem;
      color: var(--subtext);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--danger);
    }

    .indicator.connected {
      background-color: var(--success);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-connect { background-color: var(--accent); color: white; }
    .btn-high { background-color: var(--success); color: white; }
    .btn-low { background-color: var(--danger); color: white; }

    .control-group {
      display: flex;
      gap: 12px;
    }

    .control-group .btn {
      flex: 1;
    }

    .log {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--subtext);
      text-align: left;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px;
      border-radius: 6px;
      max-height: 80px;
      overflow-y: auto;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>ESP32-C3 Control</h2>
    <div class="status">
      <span id="dot" class="indicator"></span>
      <span id="status-text">Disconnected</span>
    </div>

    <button id="connect-btn" class="btn btn-connect" onclick="toggleConnect()">Connect BLE</button>

    <div class="control-group">
      <button id="high-btn" class="btn btn-high" onclick="sendState('1')" disabled>Set HIGH</button>
      <button id="low-btn" class="btn btn-low" onclick="sendState('0')" disabled>Set LOW</button>
    </div>

    <div id="log" class="log">> Ready to connect...</div>
  </div>

  <script>
    // These must match the UUIDs from your ESP32-C3 Arduino code
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let bleCharacteristic = null;

    function log(msg) {
      const logDiv = document.getElementById("log");
      logDiv.innerHTML += `<br>> ${msg}`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function toggleConnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      } else {
        await connectBLE();
      }
    }

    async function connectBLE() {
      try {
        log("Requesting BLE Device...");
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "ESP32C3_Control" }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log("Connecting to GATT Server...");
        const server = await bleDevice.gatt.connect();

        log("Getting BLE Service...");
        const service = await server.getPrimaryService(SERVICE_UUID);

        log("Getting Characteristic...");
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        updateUI(true);
        log("Connected successfully!");

      } catch (error) {
        log(`Error: ${error.message || error}`);
        updateUI(false);
      }
    }

    async function sendState(value) {
      if (!bleCharacteristic) return;

      try {
        // Send as UTF-8 string bytes
        const encoder = new TextEncoder();
        await bleCharacteristic.writeValue(encoder.encode(value));
        log(`Sent: ${value === '1' ? 'HIGH (1)' : 'LOW (0)'}`);
      } catch (error) {
        log(`Write Error: ${error}`);
      }
    }

    function onDisconnected() {
      log("Device disconnected.");
      updateUI(false);
    }

    function updateUI(isConnected) {
      document.getElementById("dot").className = isConnected ? "indicator connected" : "indicator";
      document.getElementById("status-text").innerText = isConnected ? "Connected" : "Disconnected";
      document.getElementById("connect-btn").innerText = isConnected ? "Disconnect" : "Connect BLE";
      document.getElementById("high-btn").disabled = !isConnected;
      document.getElementById("low-btn").disabled = !isConnected;
    }
  </script>
</body>
</html>
